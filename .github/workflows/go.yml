name: Release

on:
  push:
    tags:
      - 'v*' # Triggers only when you push a version tag like v1.0.0

permissions:
  contents: write # Required to upload assets to the release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for GoReleaser to determine the version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run GoReleaser
        uses: SoftProps/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            recompose-linux-amd64
            recompose-darwin-amd64
            recompose-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Binary
        run: |
          BINARY_NAME=recompose
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="recompose.exe"
          fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o "dist/${BINARY_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}" main.go

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recompose-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
