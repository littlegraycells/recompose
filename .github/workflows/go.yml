name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # This line ensures the workflow only runs if the tag was pushed to the main branch
    if: github.event.base_ref == 'refs/heads/main' || github.ref_name != '' 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so we can verify branches

      - name: Verify Branch
        run: |
          # Check if the current tag is reachable from the main branch
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Error: Tag must be pushed from the main branch."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/recompose-linux-amd64 main.go
          GOOS=darwin GOARCH=amd64 go build -o dist/recompose-darwin-amd64 main.go
          GOOS=darwin GOARCH=arm64 go build -o dist/recompose-darwin-arm64 main.go
          GOOS=windows GOARCH=amd64 go build -o dist/recompose-windows-amd64.exe main.go

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}