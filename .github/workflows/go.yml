name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  # New Test Job
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run Tests
        run: go test -v ./...

  # Updated Build and Release Job
  build-and-release:
    runs-on: ubuntu-latest
    needs: test # This ensures binaries are only built if tests pass
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Binaries
        run: |
          mkdir -p dist
          # Use ldflags to inject the version tag into the binary
          LDFLAGS="-X main.Version=${{ github.ref_name }}"
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/recompose-linux-amd64 main.go
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/recompose-darwin-amd64 main.go
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/recompose-darwin-arm64 main.go
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/recompose-windows-amd64.exe main.go

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}